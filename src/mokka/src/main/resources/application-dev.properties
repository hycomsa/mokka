# Datasource - Local H2 Database
spring.jpa.hibernate.ddl-auto = update

wiremock.enabled=true

# Disable LDAP for development
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration

# Local H2 Database Configuration
spring.datasource.url = jdbc:h2:file:./data/mokka-dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username = sa
spring.datasource.password = 
spring.datasource.driver-class-name = org.h2.Driver

# H2 Console (for debugging)
spring.h2.console.enabled = true
spring.h2.console.path = /h2-console
